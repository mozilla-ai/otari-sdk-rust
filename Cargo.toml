[package]
name = "otari"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "A unified Rust SDK for interacting with LLMs via the Otari gateway"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mozilla-ai/otari-sdk-rust"
homepage = "https://github.com/mozilla-ai/otari-sdk-rust"
documentation = "https://docs.rs/otari"
keywords = ["llm", "ai", "gateway", "api-gateway", "otari"]
categories = ["api-bindings", "asynchronous", "web-programming"]
authors = ["Mozilla AI <otari@mozilla.ai>"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by the generated typed core (src/_client): serde_repr enums, serde_with
# field helpers, and uuid/url request and response types.
serde_repr = "0.1"
serde_with = { version = "3", default-features = false, features = ["base64", "std", "macros"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

# HTTP client (multipart is required by the generated core's file uploads).
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
reqwest-eventsource = "0.6"

# Error handling
thiserror = "2"

# Date/time types used in the control-plane query parameters and the generated
# core; the serde feature is required by the generated models.
chrono = { version = "0.4", features = ["serde"] }



[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
wiremock = "0.6"
dotenvy = "0.15"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Lint groups with explicit priorities
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow certain patterns that are acceptable
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# These are too noisy for this codebase
use_self = "allow"
doc_markdown = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"
match_wildcard_for_single_variants = "allow"
derive_partial_eq_without_eq = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
similar_names = "allow"
items_after_statements = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
redundant_closure_for_method_calls = "allow"
should_implement_trait = "allow"
unnecessary_wraps = "allow"
or_fun_call = "allow"
match_same_arms = "allow"
useless_vec = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"
default_trait_access = "allow"
redundant_else = "allow"
derivable_impls = "allow"
manual_let_else = "allow"
cognitive_complexity = "allow"
cast_possible_truncation = "allow"
assigning_clones = "allow"
map_unwrap_or = "allow"
single_match_else = "allow"
if_not_else = "allow"
match_bool = "allow"
unnecessary_cast = "allow"
cast_lossless = "allow"
needless_continue = "allow"
redundant_closure = "allow"
